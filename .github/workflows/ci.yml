name: ci

on:
  push:
    branches: [master, main]
    # A tag is what gives a released image its version; the branch gives it `latest` and its commit.
    tags: ['v*']
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    # The repository tests need a real MongoDB; without it they skip and the coverage printed below
    # would be missing the queries. The tests drop the users collection, so nothing here is worth
    # keeping.
    env:
      TEST_MONGO_URI: mongodb://localhost:27017
    services:
      mongodb:
        image: mongo:7
        ports: ['27017:27017']
        options: >-
          --health-cmd "mongosh --quiet --eval 'db.runCommand({ping:1}).ok'"
          --health-interval 5s --health-timeout 5s --health-retries 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - run: go mod download
      - run: go build ./...
      - run: go vet ./...
      - run: go test -race -coverprofile=coverage.out ./...
      - run: go tool cover -func=coverage.out | tail -1

  e2e:
    runs-on: ubuntu-latest
    needs: build
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Start the stack and wait for the healthchecks
        # --wait blocks until mongo, redis and the server all report healthy. Waiting only for the
        # TCP port to open is not enough: the server accepts connections before it can reach the
        # database it authenticates against.
        run: docker compose up -d --build --wait --wait-timeout 180
      - name: What is running
        if: always()
        run: docker compose ps
      - name: Smoke test
        # A container that is healthy is not necessarily a server whose database connection is
        # warm, and a fresh runner is slower than a development machine, so the protocol test gets
        # three goes and prints what is running in between.
        run: |
          for attempt in 1 2 3; do
            if python3 scripts/smoke.py 127.0.0.1 ${SERVER_PORT:-8999}; then
              exit 0
            fi
            echo "attempt ${attempt} failed, the stack may still be warming up"
            docker compose ps
            docker compose logs --tail 40 zinx-server
            sleep 10
          done
          exit 1
      - name: Server logs
        if: always()
        run: docker compose logs zinx-server


  image:
    # Only a push publishes. A pull request from a fork cannot write to the registry anyway, and a
    # pull request from a branch would be noise in a package nobody asked for.
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
      attestations: write
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Log in to the GitHub container registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Work out the tags
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          # v1.2.3 becomes 1.2.3 and 1.2, the branch becomes `master`, and the default branch also
          # gets `latest`; the commit short sha is there so an image can always be traced back.
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=ref,event=branch
            type=sha,format=short
            type=raw,value=latest,enable={{is_default_branch}}
      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          # Both architectures: the Dockerfile honours TARGETARCH, so the only cost is a second
          # build under emulation.
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          # An image that says what it was built from, and a list of what is inside it.
          provenance: true
          sbom: true

  chart:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: azure/setup-helm@v4
        with:
          version: v3.16.3
      - name: Lint the chart strictly
        run: make chart
      - name: The chart must refuse to render without credentials
        # A guard nobody tests is a guard that quietly stops working - the same rule the chart's own
        # message points at, and the one that failed silently before this step existed.
        run: make guard
      - name: The rendered manifest must keep its claims
        run: |
          helm template dev charts/zinx-server > /tmp/render.yaml
          for claim in "maxUnavailable: 0" "minAvailable: 1" "automountServiceAccountToken: false" \
                       "readOnlyRootFilesystem: true" "tcpSocket" "kind: HorizontalPodAutoscaler" \
                       "kind: PodDisruptionBudget" "kind: NetworkPolicy"; do
            grep -q "$claim" /tmp/render.yaml || { echo "the chart no longer has: $claim"; exit 1; }
          done
          echo "every claim is in the manifest"
