name: ci

on:
  push:
    branches: [master, main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - run: go mod download
      - run: go build ./...
      - run: go vet ./...
      - run: go test -race -coverprofile=coverage.out ./...
      - run: go tool cover -func=coverage.out | tail -1

  e2e:
    runs-on: ubuntu-latest
    needs: build
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Start the stack and wait for the healthchecks
        # --wait blocks until mongo, redis and the server all report healthy. Waiting only for the
        # TCP port to open is not enough: the server accepts connections before it can reach the
        # database it authenticates against.
        run: docker compose up -d --build --wait --wait-timeout 180
      - name: What is running
        if: always()
        run: docker compose ps
      - name: Smoke test
        # A container that is healthy is not necessarily a server whose database connection is
        # warm, and a fresh runner is slower than a development machine, so the protocol test gets
        # three goes and prints what is running in between.
        run: |
          for attempt in 1 2 3; do
            if python3 scripts/smoke.py 127.0.0.1 ${SERVER_PORT:-8999}; then
              exit 0
            fi
            echo "attempt ${attempt} failed, the stack may still be warming up"
            docker compose ps
            docker compose logs --tail 40 zinx-server
            sleep 10
          done
          exit 1
      - name: Server logs
        if: always()
        run: docker compose logs zinx-server
