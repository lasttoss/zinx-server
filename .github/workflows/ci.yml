name: ci

on:
  push:
    branches: [master, main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - run: go mod download
      - run: go build ./...
      - run: go vet ./...
      - run: go test -race -coverprofile=coverage.out ./...
      - run: go tool cover -func=coverage.out | tail -1

  e2e:
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Start the stack
        run: docker compose up -d --build
      - name: Wait for the server
        run: |
          for i in $(seq 1 60); do
            if (echo > /dev/tcp/127.0.0.1/8999) 2>/dev/null; then exit 0; fi
            sleep 2
          done
          docker compose logs
          exit 1
      - name: Smoke test
        run: python3 scripts/smoke.py 127.0.0.1 $${SERVER_PORT:-8999}
      - name: Server logs
        if: always()
        run: docker compose logs zinx-server
