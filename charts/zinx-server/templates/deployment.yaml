{{- if and (not .Values.secret.existingSecret) (not .Values.secret.allowMissing) }}
{{- fail (printf "secret.existingSecret is required: %s would otherwise start with no credentials and crash loop. Name the Secret that holds them, or set secret.allowMissing=true to render outside a cluster." .Chart.Name) }}
{{- end }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "zinx-server.fullname" . }}
  labels:
    {{- include "zinx-server.labels" . | nindent 4 }}
spec:
  {{- if not .Values.autoscaling.enabled }}
  replicas: {{ .Values.replicaCount }}
  {{- end }}
  strategy:
    type: RollingUpdate
    rollingUpdate:
      # A client holds a TCP connection open; maxUnavailable: 0 means a rolling update never takes one out
      # of the Service before its successor is ready to accept.
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      {{- include "zinx-server.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "zinx-server.selectorLabels" . | nindent 8 }}
    spec:
      serviceAccountName: {{ include "zinx-server.fullname" . }}
      automountServiceAccountToken: false
      # Long enough for the server to close its sessions rather than cut them.
      terminationGracePeriodSeconds: 60
      securityContext:
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: server
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - name: tcp
              containerPort: {{ .Values.service.targetPort }}
          {{- if .Values.secret.existingSecret }}
          # The named Secret supplies the configuration. The inline values below are for a
          # local install only: env wins over envFrom, so the two must never be set together.
          envFrom:
            - secretRef:
                name: {{ .Values.secret.existingSecret }}
          {{- else }}
          env:
            - name: MONGO_URI
              value: {{ .Values.config.mongoUri | quote }}
            - name: REDIS_HOST
              value: {{ .Values.config.redisHost | quote }}
            - name: REDIS_PORT
              value: {{ .Values.config.redisPort | quote }}
          # The protocol is raw TCP, so a TCP probe is the honest check: it is the same thing a client does.
          {{- end }}
          readinessProbe:
            tcpSocket:
              port: tcp
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            tcpSocket:
              port: tcp
            initialDelaySeconds: 20
            periodSeconds: 20
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
      volumes: []
