{{- if .Values.networkPolicy.enabled }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "zinx-server.fullname" . }}
  labels:
    {{- include "zinx-server.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "zinx-server.selectorLabels" . | nindent 6 }}
  policyTypes:
    - Ingress
    - Egress
  ingress:
    # Clients dial the game port. A policy that forgets this is a policy that takes the server offline.
    - ports:
        - port: {{ .Values.service.targetPort }}
          protocol: TCP
  egress:
    - ports:
        - port: 53
          protocol: UDP
        - port: 53
          protocol: TCP
    - ports:
        {{- range .Values.networkPolicy.datastorePorts }}
        - port: {{ . }}
          protocol: TCP
        {{- end }}
{{- end }}
