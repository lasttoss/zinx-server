apiVersion: v1
kind: Pod
metadata:
  name: {{ include "zinx-server.fullname" . }}-test-ready
  labels:
    {{- include "zinx-server.labels" . | nindent 4 }}
  annotations:
    "helm.sh/hook": test
    "helm.sh/hook-delete-policy": before-hook-creation,hook-succeeded
spec:
  restartPolicy: Never
  automountServiceAccountToken: false
  containers:
    - name: check
      image: busybox:1.36
      command:
        - sh
        - -c
        # The same thing a client does: open a TCP connection to the game port.
        - 'nc -z -w 5 {{ include "zinx-server.fullname" . }} {{ .Values.service.port }} && echo "the game port accepts a connection"'
      securityContext:
        allowPrivilegeEscalation: false
        capabilities:
          drop:
            - ALL
